<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Options mistral Summarizer</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      min-width: 300px;
    }
    input[type="text"],
    input[type="number"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
    .config-section {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px dashed #ddd;
      border-radius: 4px;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      height: 80px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Configuration de l'Extension</h2>

  <div class="config-section">
    <h3>Clé API mistral</h3>
    <label for="mistralApiKey">Clé API (API Key):</label>
    <input type="password" id="mistralApiKey" placeholder="Entrez votre clé API mistral ici">
  </div>

  <div class="config-section">
    <h3>Taille du Résumé</h3>
    <label for="summaryWordCount">Nombre de mots (par défaut : 200) :</label>
    <input type="number" id="summaryWordCount" min="50" max="500" value="200" placeholder="Ex: 200">
  </div>

  <div class="config-section">
    <h3>Langue de Sortie</h3>
    <label for="summaryLanguage">Langue souhaitée (par défaut : Français) :</label>
    <select id="summaryLanguage">
      <option value="Français">Français</option>
      <option value="English">English</option>
      <option value="Español">Español</option>
      <option value="Deutsch">Deutsch</option>
      <option value="Italiano">Italiano</option>
    </select>
  </div>

  <div class="config-section">
    <h3>Modèle Mistral</h3>
    <label for="mistralModel">Modèle à utiliser :</label>
    <select id="mistralModel">
      <option value="mistral-large-latest">mistral-large-latest</option>
      <option value="mistral-large-3">mistral-large-3</option>
      <option value="mistral-medium-latest">mistral-medium-latest</option>
      <option value="mistral-small-latest">mistral-small-latest</option>
      <option value="open-mistral-nemo">open-mistral-nemo</option>
    </select>
  </div>

  <div class="config-section">
    <h3>Prompt de résumé personnalisé</h3>
    <label for="customPrompt">Prompt de résumé :</label>
    <small>Variables : {count} = mots, {lang} = langue, {text} = contenu</small>
    <textarea id="customPrompt"></textarea>
  </div>

  <button id="save-button">Enregistrer la Configuration</button>
  <div id="status"></div>

  <p style="margin-top: 20px; font-size: 0.9em;">
    Obtenez votre clé API sur le
    <a href="https://console.mistral.ai/home?workspace_dialog=apiKeys" target="_blank">Mistral AI Console</a>.
  </p>

  <script src="options.js"></script>
</body>
</html>
